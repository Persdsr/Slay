version: '3.8'

services:
  app:
    image: my-backend:latest
    container_name: my-backend-container
    volumes:
      - /root/Slay/uploads:/app/uploads
    ports:
      - "8080:8080"
    restart: always

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  redis_data: