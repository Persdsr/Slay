server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8001
          predicates:
            - Path=/api/auth/**, /api/user/**, /api/chat/**

        - id: course-service
          uri: http://localhost:8002
          predicates:
            - Path=/api/training-course/**, /api/category/**
      
        - id: support-service
          uri: http://localhost:8003
          predicates:
            - Path=/api/support/**

        - id: complaint-service
          uri: http://localhost:8004
          predicates:
            - Path=/api/complaint/**, /api/complaint-course/**, /api/complaint-user/**