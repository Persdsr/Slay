version: '3.8'

services:
  api-gateway:
    container_name: api-gateway
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  user:
    container_name: user
    build:
      context: ./user
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - postgres_db
    environment:
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres_db:5432/Slay?useSSL=false&serverTimezone=UTC'
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  course:
    container_name: course
    build:
      context: ./course
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8002:8002"
    depends_on:
      - redis
      - postgres_db
    environment:
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres_db:5432/Slay?useSSL=false&serverTimezone=UTC'
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  support:
    container_name: support
    build:
      context: ./support
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8003:8003"
    depends_on:
      - redis
      - postgres_db
    environment:
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres_db:5432/Slay?useSSL=false&serverTimezone=UTC'
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  complaint:
    container_name: complaint
    build:
      context: ./complaint
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8004:8004"
    depends_on:
      - redis
      - postgres_db
    environment:
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://demo_db:5432/Slay?useSSL=false&serverTimezone=UTC'
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  notification:
    container_name: notification
    build:
      context: ./notification
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres_db
    environment:
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres_db:5432/Slay?useSSL=false&serverTimezone=UTC'
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  postgres_db:
    container_name: postgres_container
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Slay
    volumes:
      - postgres_db:/data/postgres
    ports:
      - "5432:5432"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "512M"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "256M"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "384M"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: "1G"

volumes:
  redis_data:
  postgres_db:
